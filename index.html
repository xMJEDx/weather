<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1030" id="tc">
<title>طقسي</title>
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ati">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0a1030;--g2:#18215a;--g3:#2b3a7a;--tx:#fff;--sub:rgba(255,255,255,.7);--cd:rgba(255,255,255,.13);--cd2:rgba(255,255,255,.22);--ln:rgba(255,255,255,.16);--ac:#7cc4ff;--gold:#ffd27a;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Tajawal",-apple-system,"SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif;color:var(--tx);background:var(--g1);overflow:hidden;font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);transition:background 1s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--safe-t) + 14px) 14px calc(104px + var(--safe-b));max-width:720px;margin:auto;-webkit-overflow-scrolling:touch}
#app.in{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.top h1{font-size:25px;margin:0;font-weight:800}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--cd);display:grid;place-items:center;flex:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .12s}
.ib:active{transform:scale(.9)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12.5px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:15px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.2px}
.btn{border:0;background:#fff;color:#12204a;border-radius:15px;padding:11px 16px;font-weight:800;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--cd2);color:#fff}
.btn.r{background:#ff5a5f;color:#fff}
.btn.sm{padding:7px 13px;border-radius:12px;font-size:13px}
.btn.full{width:100%}
.seg{display:flex;background:var(--cd);border-radius:14px;padding:3px;gap:2px;border:1px solid var(--ln)}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--sub);transition:background .2s}
.seg button.on{background:#fff;color:#12204a}
select,input[type=number]{width:100%;background:var(--cd);border:1px solid var(--ln);border-radius:13px;padding:11px 12px;outline:none;color:#fff}
select option{color:#111}
label.l{display:block;font-size:12.5px;color:var(--sub);margin:14px 2px 6px}
.hero{text-align:center;padding:10px 0 18px}
.hero .em{font-size:64px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.hero .t{font-size:96px;font-weight:300;line-height:1;margin:4px 0 0;letter-spacing:-3px;padding-inline-start:12px}
.hero .c{font-size:20px;font-weight:700;margin-top:4px}
.hero .hl{color:var(--sub);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cd2);border:1px solid var(--ln);border-radius:30px;padding:8px 14px;font-weight:700;font-size:13.5px;margin-top:12px;backdrop-filter:blur(10px)}
.nx3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nx3>div{background:var(--cd);border-radius:18px;padding:12px 4px;text-align:center}
.nx3 b{font-size:26px;display:block;font-weight:700}
.nx3 span{font-size:12px;color:var(--sub)}
.spark{width:100%;height:64px;margin-top:12px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin-top:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;text-align:center;font-size:12px;padding:8px 0;border-radius:16px}
.hr.now{background:var(--cd2)}
.hr b{display:block;font-size:17px;margin:3px 0;font-weight:700}
.hr .p{color:#9fd4ff;font-size:11px;font-weight:700;min-height:14px}
.dy{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.dy:last-child{border:0;padding-bottom:0}
.dy .dn{width:64px;font-weight:700}
.dy .de{font-size:22px;width:30px;text-align:center}
.dy .dp{width:36px;font-size:11.5px;color:#9fd4ff;font-weight:700}
.dy .bar{flex:1;height:6px;background:var(--cd);border-radius:6px;position:relative}
.dy .bar i{position:absolute;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,#7cc4ff,#ffd27a,#ff8a4c)}
.dy .tv{width:32px;text-align:center;font-weight:800}
.dy .tv.lo{color:var(--sub);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>div{background:var(--cd);border-radius:18px;padding:13px}
.grid2 b{display:block;font-size:22px;font-weight:700;margin-top:2px}
.grid2 .sub{display:flex;align-items:center;gap:5px}
.sunbar{height:6px;background:var(--cd2);border-radius:6px;position:relative;margin:14px 0 8px}
.sunbar i{position:absolute;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffd27a,#ff8a4c)}
.sunbar u{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#ffd27a;box-shadow:0 0 12px #ffd27a;transform:translateX(50%)}
.seas{border-radius:22px;padding:15px;margin-bottom:12px;background:linear-gradient(140deg,rgba(255,210,122,.28),rgba(255,138,76,.14));border:1px solid rgba(255,210,122,.5)}
.seas .nm{font-size:22px;font-weight:800}
.seas .em{font-size:38px}
.pbar{height:7px;background:var(--cd2);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd27a,#ff8a4c);border-radius:8px}
.skel{height:16px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.28),rgba(255,255,255,.1));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--sub);padding:24px 0}
/* nav */
.nav{position:fixed;bottom:calc(10px + var(--safe-b));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;padding:6px;background:rgba(10,14,36,.55);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--ln);border-radius:28px;z-index:40;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);font-weight:700;padding:8px 2px;border-radius:22px;transition:all .2s}
.nav button.on{color:#fff;background:var(--cd2)}
/* sheet */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
#sheetWrap.on{display:flex}
#sheetBody{background:#141a3d;color:#fff;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:14px 16px calc(24px + var(--safe-b));border:1px solid var(--ln);animation:up .24s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--ln);margin:0 auto 12px}
.toast{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translateX(-50%);background:#fff;color:#12204a;padding:10px 18px;border-radius:16px;font-weight:800;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center;animation:fade .2s}
/* prayer */
.pnext{text-align:center;padding:20px 12px}
.pnext .n{font-size:15px;color:var(--sub);font-weight:700}
.pnext .nm{font-size:34px;font-weight:800;margin:2px 0}
.pnext .cd{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.pr{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--ln);font-size:17px}
.pr:last-child{border:0}
.pr .pn{flex:1;font-weight:700}
.pr .pt{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.pr.nx{background:var(--cd2);border-radius:16px;border-color:transparent}
.pr.mut{color:var(--sub);font-size:15px}
/* calendar */
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:11.5px;color:var(--sub);padding:4px 0;font-weight:700}
.cell{position:relative;min-height:58px;border-radius:15px;background:var(--cd);border:1px solid transparent;padding:5px 2px;text-align:center;overflow:hidden;transition:transform .1s}
.cell:active{transform:scale(.94)}
.cell.out{opacity:.3}
.cell.today{background:#fff;color:#12204a}
.cell.today .n2{color:#4a5a8a}
.cell.fri .n1{color:#9fd4ff}
.cell.today.fri .n1{color:#12204a}
.cell .n1{font-weight:800;font-size:16px}
.cell .n2{font-size:10px;color:var(--sub);margin-top:-1px}
.cell .oc{position:absolute;bottom:3px;left:0;right:0;font-size:10px}
.cell .star{position:absolute;top:3px;inset-inline-end:5px;font-size:9px;color:var(--gold)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mh .t{font-weight:800;font-size:19px;text-align:center}
.mh .t small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.oc-r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.oc-r:last-child{border:0}
.oc-r .e{font-size:24px}
/* date hero */
.dh{border-radius:28px;padding:12px;margin-bottom:14px;background:linear-gradient(160deg,rgba(24,30,58,.78),rgba(10,14,32,.82));border:1px solid rgba(217,180,95,.42);box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.dh .tg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dh .tag{border:1px solid rgba(217,180,95,.45);border-radius:14px;padding:6px 12px;font-size:12px;color:#d9b45f;background:rgba(217,180,95,.08);font-weight:700}
.dh .g3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.dh .bx{border:1px solid rgba(217,180,95,.32);border-radius:22px;background:rgba(14,20,46,.88);text-align:center;padding:14px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:150px}
.dh .bn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(217,180,95,.5);display:grid;place-items:center;font-size:22px;font-weight:800;color:#d9b45f;background:rgba(255,255,255,.04)}
.dh .mn{font-size:16px;font-weight:700;color:#ecd9a6}
.dh .en{font-size:8.5px;letter-spacing:.6px;padding:0 2px;color:var(--sub)}
.dh .yr{font-size:14px;color:var(--sub)}
.dh .wd{font-family:"Aref Ruqaa","Tajawal",serif;font-size:38px;color:#d9b45f;line-height:1.25;text-shadow:0 2px 14px rgba(217,180,95,.35)}
.dh .wde{border:1px solid rgba(217,180,95,.45);border-radius:14px;padding:3px 12px;font-size:11px;letter-spacing:2px;color:#d9b45f;font-weight:800;background:rgba(217,180,95,.08)}
.hero2{border-radius:30px;padding:18px 14px 16px;margin-bottom:12px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.22)}
.hero2 .hero{padding:0}
.hero2 .hero .t{font-size:88px}
.hero2 .mm{display:flex;justify-content:center;gap:10px;margin-top:12px}
.hero2 .mm span{background:rgba(255,255,255,.1);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700}
.card h3{display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:3px;background:#d9b45f}
/* radar */
#radar{position:fixed;inset:0;z-index:5;background:#0b0f1d;display:none}
#rmap{position:absolute;inset:0;background:#0b0f1d}
.glass{background:rgba(12,16,38,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14)}
.rtop{position:absolute;top:calc(var(--safe-t) + 12px);inset-inline:12px;z-index:500;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.rtop>*{pointer-events:auto}
.rtop .chip{border-radius:30px;padding:9px 16px;font-weight:800;display:flex;gap:6px;align-items:center;width:fit-content}
#radar .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(12,16,38,.86)}
.rside{position:absolute;inset-inline-end:12px;top:calc(var(--safe-t) + 70px);z-index:500;display:flex;flex-direction:column;gap:8px}
.rside button{width:44px;height:44px;border-radius:14px;color:#fff;font-size:20px;display:grid;place-items:center;font-weight:700}
.rside button.on{background:#fff;color:#12204a}
.rpanel{position:absolute;inset-inline:12px;bottom:calc(88px + var(--safe-b));z-index:500;border-radius:28px;padding:14px 16px 12px;max-width:696px;margin:auto;background:linear-gradient(180deg,rgba(24,30,58,.92),rgba(14,18,38,.94));border:1px solid rgba(255,255,255,.09);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.rpanel .r1{display:flex;align-items:center;gap:14px}
.rpanel .sp{flex:1;min-width:0}
.rplay{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(145deg,#fff,#dce6ff);color:#12204a;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(120,160,255,.35);transition:transform .15s}
.rplay:active{transform:scale(.92)}
.rtime{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;line-height:1;letter-spacing:.5px;text-align:start}
.rbadge{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px;transition:color .3s}
.rbadge.f{color:#ffd27a}
.rtl{position:relative;height:44px;margin:12px 6px 0;touch-action:none;cursor:pointer;--p:100%;-webkit-user-select:none;user-select:none}
.rln{position:absolute;top:19px;left:0;right:0;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.13) var(--p),rgba(255,210,122,.2) var(--p))}
.rfill{position:absolute;top:19px;left:0;height:6px;border-radius:6px;width:0;background:linear-gradient(90deg,#6fb4ff,#c8e0ff);box-shadow:0 0 12px rgba(111,180,255,.5)}
.rticks{position:absolute;inset:0;pointer-events:none}
.tk{position:absolute;top:15px;width:2px;height:14px;margin-left:-1px;border-radius:2px;background:rgba(255,255,255,.3)}
.tk.f{background:rgba(255,210,122,.55)}
.tk.now{top:11px;height:22px;background:#fff;opacity:.9}
.rhead{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.rhead::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.rhead::after{content:"";position:absolute;left:-12px;top:10px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.5),0 0 0 5px rgba(255,255,255,.16)}
.rlbl{position:relative;height:16px;margin:0 6px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.rlbl span{position:absolute;top:0;white-space:nowrap}
#rl0{left:0}#rl1{right:0}#rlnow{transform:translateX(-50%);color:#fff;font-weight:700}
.rleg{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--sub);direction:rtl;width:120px;flex:none}
.rleg i{flex:1;height:6px;border-radius:7px;background:linear-gradient(90deg,#9fe5ff,#3aa0ff,#1760e6,#6b2fd0,#e0309a,#ff4d4d)}
.rattr{font-size:10px;color:rgba(255,255,255,.4);text-align:center;margin-top:8px}
.rhint{position:absolute;left:50%;bottom:calc(298px + var(--safe-b));transform:translate(-50%,10px);z-index:520;background:rgba(14,18,38,.94);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:92vw;text-align:center}
.rhint.on{opacity:1;transform:translate(-50%,0)}
.rmsg{position:absolute;inset:0;z-index:600;display:none;place-items:center;text-align:center;padding:30px;background:rgba(8,10,24,.7);backdrop-filter:blur(4px);font-weight:700}
.rmsg.on{display:grid}
.rdot{width:16px;height:16px;border-radius:50%;background:#ff4d6d;border:3px solid #fff;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
.leaflet-container{background:#0b0f1d;font-family:inherit}
.leaflet-control-attribution{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="radar">
 <div id="rmap"></div>
 <div class="rtop"><div><div class="glass chip" id="rcity">📍</div><div class="glass chip" id="rwind" style="display:none;margin-top:8px;font-size:12px;padding:7px 12px;gap:7px"></div></div><button class="ib glass" id="rgear" aria-label="الإعدادات"></button></div>
 <div class="rside">
  <button class="glass" id="rzin" aria-label="تكبير">+</button>
  <button class="glass" id="rzout" aria-label="تصغير">−</button>
  <button class="glass" id="rloc" aria-label="موقعي">◎</button>
  <button class="glass" id="rlay" aria-label="قمر صناعي" style="display:none">🛰️</button>
 </div>
 <div class="rhint" id="rhint">الرادار يظهر لحد مستوى المنطقة • قرّب أو بعّد للرجوع</div>
 <div class="rpanel">
  <div class="r1">
   <button class="rplay" id="rplay" aria-label="تشغيل"></button>
   <div class="sp"><div class="rtime" id="rtime">--:--</div><div class="rbadge" id="rbadge"></div></div>
   <div class="rleg"><span>خفيف</span><i></i><span>غزير</span></div>
  </div>
  <div class="rtl" id="rtl" dir="ltr"><div class="rln"></div><div class="rfill" id="rfill"></div><div class="rticks" id="rticks"></div><div class="rhead" id="rhead"></div></div>
  <div class="rlbl" dir="ltr"><span id="rl0"></span><span id="rlnow"></span><span id="rl1"></span></div>
  <div class="rattr">أبيض: رادار حقيقي • ذهبي: توقّع تقديري باتجاه الرياح • RainViewer • © OpenStreetMap</div>
 </div>
 <div class="rmsg" id="rmsg"><div><div id="rmsgt" style="margin-bottom:14px"></div><button class="btn" id="rretry">إعادة المحاولة</button></div></div>
</div>
<div id="app"></div>
<div id="sheetWrap" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<nav class="nav" id="nav" aria-label="التنقل"></nav>
<script>
"use strict";
/* ============ icons ============ */
const IC={
 weather:'<path d="M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.5 11 3.5 3.5 0 0 1 19 18z"/>',
 radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.4-6.4"/>',
 prayer:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/><path d="M17 4v3M15.5 5.5h3"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',

function wxCalc(){

 const base=cur.time.slice(0,13)+":00";let i0=h.time.findIndex(x=>x>=base);if(i0<0)i0=0;
 const nx=[];
 for(let i=i0;i<Math.min(h.time.length,i0+25);i++)nx.push({t:h.time[i],temp:h.temperature_2m[i],p:(h.precipitation_probability||[])[i]||0,c:h.weather_code[i],day:dayAt(h.time[i],dl)});

const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const sinD=x=>Math.sin(rad(x)),cosD=x=>Math.cos(rad(x)),tanD=x=>Math.tan(rad(x));
const fixH=h=>{h=h%24;return h<0?h+24:h},fixA=a=>{a=a%360;return a<0?a+360:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
 const D=jd-2451545,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),L=fixA(q+1.915*sinD(g)+0.020*sinD(2*g)),e=23.439-0.00000036*D;
 const RA=fixH(deg(Math.atan2(cosD(e)*sinD(L),cosD(L)))/15);
 return{decl:deg(Math.asin(sinD(e)*sinD(L))),eq:q/15-RA};
}
const hhmm=h=>{if(!isFinite(h))return"--:--";const m=Math.round(fixH(h)*60);return pad(Math.floor(m/60)%24)+":"+pad(m%60)};
/* حساب أم القرى: فجر 18.5°، العشاء بعد المغرب بـ 90 دقيقة (120 برمضان) */
function calcPrayer(date,lat,lon){
 const tz=-date.getTimezoneOffset()/60,adj=tz-lon/15;
 const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lon/360;
 const mid=t=>fixH(12-sunPos(jd+t).eq);
 const ang=(a,t,ccw)=>{const p=sunPos(jd+t),v=(-sinD(a)-sinD(p.decl)*sinD(lat))/(cosD(p.decl)*cosD(lat));if(Math.abs(v)>1)return NaN;const h=deg(Math.acos(v))/15;return mid(t)+(ccw?-h:h)};
 const pa=sunPos(jd+13/24),asrA=-deg(Math.atan(1/(1+tanD(Math.abs(lat-pa.decl)))));
 const maghrib=ang(0.833,18/24,false)+adj,ram=hij(date).m===9;
 return{Fajr:hhmm(ang(18.5,5/24,true)+adj),Sunrise:hhmm(ang(0.833,6/24,true)+adj),Dhuhr:hhmm(mid(12/24)+adj),Asr:hhmm(ang(asrA,13/24,false)+adj),Maghrib:hhmm(maghrib),Isha:hhmm(maghrib+(ram?120:90)/60)};
}
const PR={cache:{},loading:{}};
try{PR.api=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){PR.api={}}
const pkey=d=>{const l=locNow();return ymd(d)+"|"+l.lat.toFixed(2)+","+l.lon.toFixed(2)};
function prayerTimes(d){
 const k=pkey(d);
 if(PR.api[k])return{t:PR.api[k],src:"api"};
 const l=locNow();return{t:calcPrayer(d,l.lat,l.lon),src:"calc"};
}
async function loadPrayer(d){
 const k=pkey(d);
 if(PR.api[k]||PR.loading[k]||navigator.onLine===false)return;
 PR.loading[k]=1;
 try{
  const l=locNow();
  const r=await fetch("https://api.aladhan.com/v1/timings/"+pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+"?latitude="+l.lat+"&longitude="+l.lon+"&method=4");
  if(!r.ok)throw 0;const j=await r.json(),tm=j&&j.data&&j.data.timings;
  if(!tm||!tm.Fajr)throw 0;
  const o={};["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"].forEach(n=>o[n]=String(tm[n]).slice(0,5));
  PR.api[k]=o;
  const ks=Object.keys(PR.api);if(ks.length>40)ks.slice(0,ks.length-40).forEach(x=>delete PR.api[x]);
  try{localStorage.setItem(PKEY,JSON.stringify(PR.api))}catch(e){}
  if(S.view==="prayer"){S.keep=true;render()}
 }catch(e){}
 delete PR.loading[k];
}
const PN=[["Fajr","الفجر","🌌"],["Sunrise","الشروق","🌅"],["Dhuhr","الظهر","☀️"],["Asr","العصر","🌤️"],["Maghrib","المغرب","🌇"],["Isha","العشاء","🌙"]];
const PRAY5=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const atTime=(d,s)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),+s.slice(0,2),+s.slice(3,5),0);
function nextPrayer(){
 const now=new Date(),tm=prayerTimes(now).t;
 for(const n of PRAY5){const at=atTime(now,tm[n]);if(at>now)return{n,at}}
 const tom=addDays(now,1),tt=prayerTimes(tom).t;
 return{n:"Fajr",at:atTime(tom,tt.Fajr)};
}
const pName=n=>(PN.find(x=>x[0]===n)||[])[1]||n;
const cdFmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};

 h+=`<div class="card"><div class="mh" style="margin-bottom:4px"><button class="ib" onclick="pDay(-1)" aria-label="اليوم السابق">${prevI()}</button><div class="sub">${today?"اليوم":DN[d.getDay()]}</div><button class="ib" onclick="pDay(1)" aria-label="اليوم التالي">${nextI()}</button></div>`;
 h+=PN.map(([k,n,e])=>`<div class="pr ${nx&&nx.n===k&&ymd(nx.at)===ymd(d)?"nx":""} ${k==="Sunrise"?"mut":""}"><span>${e}</span><span class="pn">${k==="Dhuhr"&&d.getDay()===5?"الجمعة":n}</span><span class="pt">${t12(tm[k])}</span></div>`).join("");

/* الخريطة تقرّب لحد الشوارع (17). صور الرادار جاهزة لحد زوم 7 فقط وتكبيرها أكثر يملأ ذاكرة Safari،
   فطبقات الرادار نفسها سقفها RADMAX وفوقه تختفي (والخريطة تكمل)، مع ≤4 طبقات حيّة. */
const MAXZ=17,RADMAX=8,FCMIN=10,FCSTEPS=12,STEER_K=0.8,OP=.8,FPS=1.4;
const RV={map:null,Lf:null,frames:[],live:{},fc:null,pos:0,playing:false,raf:0,lt:0,hold:0,stall:0,drag:false,mode:"radar",past:[],real:[],sat:[],host:"",fts:0,loading:false,marker:null,booting:false,steer:null,nPast:0,fcOn:false,lastTxt:""};
const ICP='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>';
const ICS='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.4"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.4"/></svg>';
function rmsg(txt){const m=$("#rmsg");if(txt){$("#rmsgt").textContent=txt;m.classList.add("on")}else m.classList.remove("on")}
function rHint(){const e=$("#rhint");if(e&&RV.map)e.classList.toggle("on",RV.map.getZoom()>RADMAX)}
function rLabel(){const e=$("#rcity");if(e)e.textContent="📍 "+locNow().label}
function loadLeaflet(){
 return new Promise((res,rej)=>{
  if(window.L&&window.L.map)return res();
  if(!document.getElementById("lfcss")){const l=document.createElement("link");l.id="lfcss";l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(l)}
  let s=document.getElementById("lfjs");if(s)s.remove();
  s=document.createElement("script");s.id="lfjs";s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
  const to=setTimeout(()=>rej(new Error("timeout")),15000);
  s.onload=()=>{clearTimeout(to);window.L&&window.L.map?res():rej(new Error("lf"))};
  s.onerror=()=>{clearTimeout(to);rej(new Error("lf"))};
  document.head.appendChild(s);
 });
}
async function radarShow(){
 rLabel();
 if(RV.map){setTimeout(()=>{try{RV.map.invalidateSize()}catch(e){}},50);if(!RV.frames.length||Date.now()-RV.fts>5*6e4)radarLoad();return}
 if(RV.booting)return;
 RV.booting=true;rmsg("جاري تحميل الخريطة...");
 try{
  await loadLeaflet();
  const Lf=RV.Lf=window.L,loc=locNow();
  const map=RV.map=Lf.map("rmap",{zoomControl:false,attributionControl:false,minZoom:3,maxZoom:MAXZ,zoomSnap:1,zoomDelta:1,fadeAnimation:false,markerZoomAnimation:false,worldCopyJump:true}).setView([loc.lat,loc.lon],6);
  const bp=map.createPane("bpane");bp.style.zIndex=200;bp.style.filter="invert(1) hue-rotate(200deg) saturate(.5) brightness(.78) contrast(.9)";
  map.createPane("rpane").style.zIndex=250;map.createPane("fpane").style.zIndex=251;
  map.getPane("fpane").style.willChange="transform";
  Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{pane:"bpane",maxZoom:MAXZ,maxNativeZoom:19,keepBuffer:2}).addTo(map);
  RV.marker=Lf.marker([loc.lat,loc.lon],{icon:Lf.divIcon({className:"",html:'<div class="rdot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,keyboard:false}).addTo(map);
  map.on("zoomend",()=>{applyFc();rHint()});
  setTimeout(()=>{try{map.invalidateSize()}catch(e){}},80);
  rmsg("");RV.booting=false;
  radarLoad();
 }catch(e){RV.booting=false;rmsg("تعذّر تحميل الخريطة. تأكد من الإنترنت.")}
}
/* الرياح العلوية (700hPa ≈ 3 كم) هي اللي تحرّك السحب */
async function fetchSteer(){
 try{
  const c=RV.map.getCenter();
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+c.lat.toFixed(2)+"&longitude="+c.lng.toFixed(2)+"&hourly=wind_speed_700hPa,wind_direction_700hPa&wind_speed_unit=ms&forecast_days=2&timezone=auto");
  if(!r.ok)return null;const j=await r.json(),h=j&&j.hourly;if(!h||!h.time)return null;
  const off=(j.utc_offset_seconds||0)*1000,nowMs=Date.now();let bi=-1,bd=1e18;
  h.time.forEach((s,i)=>{const d=Math.abs(Date.parse(s+":00Z")-off-nowMs);if(d<bd){bd=d;bi=i}});
  const sp=h.wind_speed_700hPa[bi],dir=h.wind_direction_700hPa[bi];
  if(!isFinite(sp)||!isFinite(dir))return null;
  return{sp,dir};
 }catch(e){return null}
}
const DIRN=["الشمال","الشمال الشرقي","الشرق","الجنوب الشرقي","الجنوب","الجنوب الغربي","الغرب","الشمال الغربي"];
function windChip(){
 const e=$("#rwind");if(!e)return;
 if(!RV.steer||RV.mode==="sat"){e.style.display="none";return}
 const to=(RV.steer.dir+180)%360;
 e.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" style="transform:rotate('+to+'deg);flex:none" fill="none" stroke="#ffd27a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5.5 10.5L12 4l6.5 6.5"/></svg><span>السحب نحو '+DIRN[Math.round(to/45)%8]+" • "+Math.round(RV.steer.sp*3.6*STEER_K)+" كم/س</span>";
 e.style.display="flex";
}
async function radarLoad(){
 if(RV.loading||!RV.map)return;
 RV.loading=true;
 try{
  const [r,st]=await Promise.all([fetch("https://api.rainviewer.com/public/weather-maps.json",{cache:"no-store"}),fetchSteer()]);
  if(!r.ok)throw new Error("rv "+r.status);
  const j=await r.json();
  RV.host=j.host||"https://tilecache.rainviewer.com";
  RV.past=(j.radar&&j.radar.past)||[];RV.real=(j.radar&&j.radar.nowcast)||[];
  RV.sat=(j.satellite&&j.satellite.infrared)||[];
  RV.steer=st;
  if(!RV.past.length)throw new Error("no frames");
  RV.fts=Date.now();
  $("#rlay").style.display=RV.sat.length?"grid":"none";
  radarBuild();rmsg("");
 }catch(e){if(!RV.frames.length)rmsg("تعذّر تحميل بيانات الرادار.")}
 RV.loading=false;
}
const tileUrl=(path,sat)=>RV.host+path+"/256/{z}/{x}/{y}/"+(sat?"0/0_0":"2/1_1")+".png";
function clearLayers(){
 const map=RV.map;
 Object.keys(RV.live).forEach(k=>{try{map.removeLayer(RV.live[k])}catch(e){}});RV.live={};
 if(RV.fc){try{map.removeLayer(RV.fc)}catch(e){}RV.fc=null}
 const fp=map.getPane("fpane");if(fp)fp.style.transform="";
}
const hm=ts=>{const d=new Date(ts*1000);return pad(d.getHours())+":"+pad(d.getMinutes())};
function radarBuild(){
 const map=RV.map;if(!map)return;
 radarStop();clearLayers();
 const sat=RV.mode==="sat";let frames;
 if(sat){frames=RV.sat.map(f=>({time:f.time,path:f.path}));RV.nPast=frames.length}
 else{
  frames=RV.past.map(f=>({time:f.time,path:f.path}));RV.nPast=frames.length;
  if(RV.real.length)RV.real.forEach(f=>frames.push({time:f.time,path:f.path}));
  else if(RV.steer){const last=RV.past[RV.past.length-1];for(let k=1;k<=FCSTEPS;k++)frames.push({time:last.time+k*FCMIN*60,path:last.path,syn:true})}
 }
 RV.frames=frames;RV.fcOn=frames.some(f=>f.syn);
 if(RV.fcOn)RV.fc=RV.Lf.tileLayer(tileUrl(RV.past[RV.past.length-1].path),{pane:"fpane",opacity:0,maxNativeZoom:7,maxZoom:RADMAX,tileSize:256,keepBuffer:1,updateWhenZooming:false}).addTo(map);
 /* شريط الوقت: علامات لكل لقطة (أبيض = حقيقي، ذهبي = توقع) */
 const N=frames.length,den=Math.max(1,N-1);
 const hasF=frames.some((f,k)=>k>=RV.nPast);
 $("#rticks").innerHTML=frames.map((f,k)=>'<i class="tk'+(k>=RV.nPast?" f":"")+(k===RV.nPast-1&&hasF?" now":"")+'" style="left:'+(k/den*100)+'%"></i>').join("");
 $("#rtl").style.setProperty("--p",(hasF?(RV.nPast-0.5)/den*100:100)+"%");
 $("#rl0").textContent=hm(frames[0].time);$("#rl1").textContent=hm(frames[N-1].time);
 const ln=$("#rlnow");ln.textContent=hasF?"الآن":"";ln.style.left=(hasF?(RV.nPast-1)/den*100:0)+"%";
 windChip();
 RV.lastTxt="";renderPos(sat?N-1:RV.nPast-1);
}
function liveLayer(i){
 if(!RV.live[i]){
  const f=RV.frames[i],l=RV.Lf.tileLayer(tileUrl(f.path,RV.mode==="sat"),{pane:"rpane",opacity:0,maxNativeZoom:7,maxZoom:RADMAX,tileSize:256,keepBuffer:1,updateWhenZooming:false});
  l._rvLoaded=false;l.on("load",()=>{l._rvLoaded=true});
  l.addTo(RV.map);RV.live[i]=l;
 }
 return RV.live[i];
}
function liveCleanup(keep){
 Object.keys(RV.live).forEach(k=>{if(!keep.includes(+k)){try{RV.map.removeLayer(RV.live[k])}catch(e){}delete RV.live[k]}});
}
/* إزاحة التوقع بالبكسل (مستمرة وناعمة) حسب الرياح والزوم */
function fcShift(min){
 const st=RV.steer,map=RV.map;if(!st||!map)return[0,0];
 const to=((st.dir+180)%360)*Math.PI/180,d=st.sp*STEER_K*min*60;
 const c=map.getCenter(),mpp=156543.03392*Math.cos(c.lat*Math.PI/180)/Math.pow(2,map.getZoom());
 return[d*Math.sin(to)/mpp,-d*Math.cos(to)/mpp];
}
function shiftTo(min){const s=fcShift(min);RV.map.getPane("fpane").style.transform="translate3d("+s[0].toFixed(2)+"px,"+s[1].toFixed(2)+"px,0)"}
function applyFc(){if(!RV.map||!RV.fcOn||RV.pos<RV.nPast-1)return;shiftTo((RV.pos-(RV.nPast-1))*FCMIN)}
/* pos رقم عشري بين اللقطات: نمزج اللقطتين بالتدريج بدل القفز */
function renderPos(pos){
 const N=RV.frames.length;if(!N||!RV.map)return;
 pos=Math.max(0,Math.min(N-1,pos));RV.pos=pos;
 const i=Math.floor(pos),t=pos-i,j=Math.min(N-1,i+1);
 if(RV.fcOn&&pos>=RV.nPast-1){
  if(Object.keys(RV.live).length){Object.keys(RV.live).forEach(k=>RV.live[k].setOpacity(0));liveCleanup([])}
  RV.fc.setOpacity(OP);shiftTo((pos-(RV.nPast-1))*FCMIN);
 }else{
  if(RV.fc){RV.fc.setOpacity(0);RV.map.getPane("fpane").style.transform=""}
  { const jj=Math.min(N-1,i+1),keep0=[i,jj];if(jj+1<(RV.fcOn?RV.nPast:N))keep0.push(jj+1);liveCleanup(keep0) }
  const A=liveLayer(i);
  if(t<.002){A.setOpacity(OP);if(RV.live[j]&&j!==i)RV.live[j].setOpacity(0)}
  else{const B=liveLayer(j);A.setOpacity(OP);B.setOpacity(OP*t)}
  Object.keys(RV.live).forEach(k=>{if(+k!==i&&+k!==j)RV.live[k].setOpacity(0)});
  const keep=[i,j];if(j+1<(RV.fcOn?RV.nPast:N))keep.push(j+1);
  liveCleanup(keep);if(keep.includes(j+1)&&!RV.live[j+1])liveLayer(j+1);
 }
 /* واجهة */
 const f=RV.frames[i],g=RV.frames[j],tm=f.time+(g.time-f.time)*t,lastPast=RV.past.length&&RV.mode==="radar"?RV.past[RV.past.length-1].time:f.time;
 const isF=RV.mode==="radar"&&pos>RV.nPast-1+.02&&(RV.fcOn||RV.real.length>0);
 let b,cls="rbadge";
 if(isF){b="توقّع "+(RV.real.length?"":"تقديري ")+"+"+Math.max(1,Math.round((tm-lastPast)/60))+" د";cls+=" f"}
 else{const diff=Math.round((Date.now()/1000-tm)/60);b=diff<=12?"الآن":"قبل "+(diff>=60?Math.floor(diff/60)+" س "+(diff%60?(diff%60)+" د":""):diff+" د")}
 const key=hm(tm)+"|"+b;
 if(key!==RV.lastTxt){RV.lastTxt=key;$("#rtime").textContent=hm(tm);const be=$("#rbadge");be.textContent=b;be.className=cls}
 {const pc=(pos/Math.max(1,N-1)*100)+"%";$("#rhead").style.left=pc;$("#rfill").style.width=pc}
}
function radarStop(){RV.playing=false;if(RV.raf){cancelAnimationFrame(RV.raf);RV.raf=0}const p=$("#rplay");if(p)p.innerHTML=ICP}
function loop(ts){
 if(!RV.playing)return;
 const dt=Math.min(.1,(ts-RV.lt)/1000);RV.lt=ts;
 const N=RV.frames.length;
 if(RV.pos>=N-1-1e-6){RV.hold+=dt;if(RV.hold>1.3){RV.hold=0;renderPos(0)}}
 else{
  const np=RV.pos+dt*FPS,jn=Math.min(N-1,Math.ceil(np));
  const l=!(RV.fcOn&&jn>=RV.nPast)?RV.live[jn]:null;
  if(l&&!l._rvLoaded&&RV.stall<1.5&&Math.floor(np)===Math.floor(RV.pos)&&jn!==Math.floor(RV.pos)){RV.stall+=dt;renderPos(RV.pos)}
  else{if(Math.floor(np)!==Math.floor(RV.pos))RV.stall=0;renderPos(np)}
 }
 RV.raf=requestAnimationFrame(loop);
}
function radarPlay(){
 if(!RV.frames.length)return;
 if(RV.playing){radarStop();return}
 if(RV.pos>=RV.frames.length-1-1e-6)renderPos(0);
 RV.playing=true;RV.hold=0;RV.stall=0;RV.lt=performance.now();
 $("#rplay").innerHTML=ICS;RV.raf=requestAnimationFrame(loop);
}
function radarRecenter(){
 if(!RV.map)return;const l=locNow();
 RV.map.setView([l.lat,l.lon],Math.min(MAXZ,Math.max(RV.map.getZoom(),6)));
 if(RV.marker)RV.marker.setLatLng([l.lat,l.lon]);
 rLabel();
 if(RV.past.length)fetchSteer().then(st=>{RV.steer=st;windChip();applyFc()});
}
/* سحب الشريط */
(function(){
 const tl=$("#rtl");
 const px=x=>{const r=tl.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/Math.max(1,r.width)))*Math.max(0,RV.frames.length-1)};
 tl.addEventListener("pointerdown",e=>{radarStop();RV.drag=true;try{tl.setPointerCapture(e.pointerId)}catch(_){}renderPos(px(e.clientX))});
 tl.addEventListener("pointermove",e=>{if(RV.drag)renderPos(px(e.clientX))});
 const end=()=>{RV.drag=false};
 tl.addEventListener("pointerup",end);tl.addEventListener("pointercancel",end);
})();
$("#rplay").innerHTML=ICP;
$("#rplay").onclick=radarPlay;
$("#rzin").onclick=()=>RV.map&&RV.map.zoomIn();
$("#rzout").onclick=()=>RV.map&&RV.map.zoomOut();
$("#rloc").onclick=()=>{if(DB.settings.loc.mode!=="gps")useGPS();radarRecenter()};
$("#rlay").onclick=()=>{RV.mode=RV.mode==="radar"?"sat":"radar";$("#rlay").classList.toggle("on",RV.mode==="sat");radarBuild()};
$("#rretry").onclick=()=>{rmsg("جاري التحميل...");if(RV.map)radarLoad().then(()=>{if(!RV.frames.length)rmsg("تعذّر تحميل بيانات الرادار.")});else radarShow()};
$("#rgear").innerHTML=ic("gear");
$("#rgear").onclick=openSettings;

/* ============ loop ============ */
function tick(){
 const now=new Date(),k=ymd(now);
 /* prayer countdown + adhan */
 const el=$("#pcd");
 if(el&&S.view==="prayer"){
  const nx=nextPrayer();
  if(nx.n!==el.dataset.n){S.keep=true;render()}else el.textContent=cdFmt(nx.at-now);
 }
 if(DB.settings.adhan){
  const tm=prayerTimes(now).t;
  PRAY5.forEach(n=>{
   const at=atTime(now,tm[n]),df=now-at,key=k+n;
   if(df>=0&&df<60000&&!FIRED[key]){FIRED[key]=1;notify("🕌 حان وقت صلاة "+pName(n),t12(tm[n]))}
  });
 }
 if(navigator.onLine!==false&&!S.wx.loading&&Date.now()-S.wx.ts>15*6e4&&Date.now()-S.wx.lastTry>3*6e4)fetchWx();
 if(S.view==="radar"&&RV.map&&!RV.loading&&!RV.timer&&Date.now()-RV.fts>10*6e4)radarLoad();
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)radarStop();if(!document.hidden){fetchWx();if(S.view==="radar")radarShow();if(S.view==="prayer"){S.keep=true;render()}}});

/* ============ PWA ============ */
(function(){
 try{
  const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#1b5fd1");g.addColorStop(1,"#7ec0ff");x.fillStyle=g;x.fillRect(0,0,180,180);
  x.fillStyle="#ffd27a";x.beginPath();x.arc(70,76,28,0,7);x.fill();
  x.fillStyle="#fff";x.beginPath();x.arc(80,112,26,0,7);x.arc(112,104,32,0,7);x.arc(138,116,22,0,7);x.fillRect(80,112,58,26);x.fill();
  const u=c.toDataURL("image/png");$("#ati").href=u;
  const m={name:"طقسي",short_name:"طقسي",display:"standalone",start_url:location.href.split("#")[0],background_color:"#0a1030",theme_color:"#0a1030",dir:"rtl",lang:"ar",icons:[{src:u,sizes:"180x180",type:"image/png"}]};
  $("#mf").href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
 }catch(e){}
 try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
render();
fetchWx();
loadPrayer(S.pdate);
if(!DB.settings.asked){DB.settings.asked=true;save();setTimeout(()=>useGPS(true),900)}
</script>
